# These are variables which are used to make expressing this
# YAML file more convenient. They are not exposed externally.
# (Stuff which uses this YAML file can't even see the names
# for each variable!)
yamlAliases:
  - &genericPaths
      root: ''
      path: '<>'

  # Static files are all grouped under a `static-${STATIC_VERSION}` folder as
  # part of a build. This is so that multiple builds of a wiki can coexist
  # served from the same server / file system root: older builds' HTML files
  # refer to earlier values of STATIC_VERSION, avoiding name collisions.
  - &staticVersion 5p2

data:
  prefix: 'data/'

  paths:
  - *genericPaths

localized:
  paths:
  - *genericPaths
  - page: '<>/'

    home: ''

    artist: 'artist/<>/'
    artistGallery: 'artist/<>/gallery/'

    listingIndex: 'list/'

    listing: 'list/<>/'

    newsIndex: 'news/'

    newsEntry: 'news/<>/'

    staticPage: '<>/'

# This gets automatically switched in place when working from
# a baseDirectory, so it should never be referenced manually.
# It's also filled in externally to this YAML spec.
localizedWithBaseDirectory: '<auto>'

shared:
  paths: *genericPaths

staticCSS:
  prefix:
  - 'static-'
  - *staticVersion
  - '/css/'

  paths: *genericPaths

staticJS:
  prefix:
  - 'static-'
  - *staticVersion
  - '/js/'

  paths: *genericPaths

staticLib:
  prefix:
  - 'static-'
  - *staticVersion
  - '/lib/'

  paths: *genericPaths

staticMisc:
  prefix:
  - 'static-'
  - *staticVersion
  - '/misc/'

  paths:
  - *genericPaths
  - icon: 'icons.svg#icon-<>'

staticSharedUtil:
  prefix:
  - 'static-'
  - *staticVersion
  - '/shared-util/'

  paths: *genericPaths

media:
  prefix: 'media/'

  paths:
  - *genericPaths

  - artistAvatar: 'artist-avatar/<>.<>'

thumb:
  prefix: 'thumb/'
  paths: *genericPaths

searchData:
  prefix: 'search-data/'
  paths: *genericPaths
